# GenTactix → Cloudflare Containers CI 部署
# 原理：GitHub Actions runner 自带 Docker，wrangler deploy 在 runner 上构建并推送镜像，
#       本机零 Docker。认证走 CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID 两个 repo secrets，
#       无需浏览器登录（区别于 deploy.sh 的 wrangler login）。
# 触发：① push 到 main 且改动涉及下列路径；② 手动 Run workflow。
# 前置（仓库 Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN  = Cloudflare API Token
#   CLOUDFLARE_ACCOUNT_ID = 你的 Account ID
# ⚠️ Token 权限必须同时包含（缺一不可）：
#   ① Account → Workers Scripts:Edit    —— 上传 Worker 脚本
#   ② Account → Workers Containers:Edit —— 构建/查询容器镜像
#    注意控制台里叫 "Workers Containers"（Developer Platform 分组下）。
#    只给 Workers 权限时，镜像能构建、Worker 也能上传，但最后会卡在
#    GET /accounts/{id}/containers/me 返回 401 Unauthorized。
# 注意：Cloudflare 账号需已订阅 Workers Paid（$5/月），否则 Containers 不可用。
# 注意：wrangler 4.x 要求 Node.js >= 22，下方 setup-node 版本不要降回 20。

name: Deploy GenTactix → Cloudflare Containers

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'gentactix/**'
      - 'Dockerfile'
      - 'wrangler.jsonc'
      - 'src/**'
      - '.streamlit/**'
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 最小权限：wrangler 用 API Token 认证，不需要 GITHUB_TOKEN 写权限
permissions:
  contents: read

# 避免重叠部署；进行中的部署不被取消（cancel-in-progress:false）
concurrency:
  group: gentactix-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # wrangler 4.x 要求 Node >= 22，用 20 会在 deploy 步骤直接报错
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker-side dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Deploy to Cloudflare Containers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # 部署后快照容器状态（即使失败也不阻塞，仅作信息输出）
      - name: Container status snapshot
        if: ${{ success() }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler containers list
